[package]
name = "streamtube-core"
version = "0.7.5-alpha"
edition = "2024"
description = "Platform-independent Stream Tube networking, storage and playback preparation"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json", "socks-proxy"] }
url = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
parking_lot = "0.12"
sha2 = "0.11"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rand = "0.9"
sha1 = "0.11"

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "6"
